<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ewelink-knil · Dispositivos</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">ewelink-knil</p><h1>Administración de dispositivos</h1></div>
      <button id="discover">Buscar CozyLife</button>
    </header>
    <p id="message" role="status">Cargando inventario…</p>
    <section>
      <div class="section-heading"><h2>Registrados</h2><button class="secondary" id="refresh">Actualizar estados</button></div>
      <div id="devices" class="grid" aria-live="polite"></div>
    </section>
    <section>
      <div class="section-heading"><h2>Detectados en la red</h2><span>Los equipos CozyLife se agregan de forma explícita.</span></div>
      <div id="discovered" class="grid" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="add-dialog" aria-labelledby="add-dialog-title">
    <form id="add-form">
      <h2 id="add-dialog-title">Agregar dispositivo CozyLife</h2>
      <p id="add-dialog-device" class="details"></p>
      <label for="add-name">Nombre del dispositivo</label>
      <input id="add-name" name="name" type="text" maxlength="64" required autocomplete="off">
      <div class="actions dialog-actions">
        <button type="button" class="secondary" id="cancel-add">Cancelar</button>
        <button type="submit" id="confirm-add">Agregar</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
